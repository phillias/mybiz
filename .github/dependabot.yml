version: 2
updates:
  - package-ecosystem: "npm"           # reads package.json / package-lock.json
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions" # keeps workflow action versions updated
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
